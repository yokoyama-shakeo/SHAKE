<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿する | AI無茶振り研究所</title>
<style>
  :root{
    --paper: #EDE6D3;
    --paper-card: #F6F1E4;
    --ink: #2B2620;
    --ink-soft: #6B6252;
    --stamp-red: #A73B2E;
    --file-teal: #3F6B5C;
    --line: #C9BFA0;
    --shadow: rgba(43,38,32,0.18);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: "Courier New", "IBM Plex Mono", monospace;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card{
    max-width: 520px;
    width: 100%;
    background: var(--paper-card);
    border: 3px solid var(--ink);
    padding: 32px;
    position: relative;
    box-shadow: 6px 6px 0 var(--shadow);
  }

  .card::before{
    content: "SUBMISSION FORM";
    position: absolute;
    top: -14px;
    left: 28px;
    background: var(--stamp-red);
    color: var(--paper-card);
    font-size: 12px;
    padding: 3px 10px;
    letter-spacing: 0.05em;
    transform: rotate(-2deg);
  }

  h1{
    font-family: Georgia, "Hiragino Mincho ProN", serif;
    font-size: 1.6rem;
    margin: 10px 0 6px;
  }

  p.intro{
    color: var(--ink-soft);
    font-size: 0.88rem;
    margin: 0 0 26px;
  }

  form{
    display: grid;
    gap: 14px;
  }

  label{
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 4px;
  }

  input, textarea, select{
    font-family: inherit;
    width: 100%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    padding: 10px 12px;
    font-size: 0.9rem;
    color: var(--ink);
    border-radius: 2px;
  }

  textarea{ resize: vertical; min-height: 90px; }

  button{
    font-family: inherit;
    justify-self: start;
    background: var(--stamp-red);
    color: var(--paper-card);
    border: none;
    padding: 12px 30px;
    font-size: 0.9rem;
    cursor: pointer;
    letter-spacing: 0.02em;
    border-radius: 2px;
    margin-top: 6px;
  }

  button:hover{ opacity: 0.9; }

  .note{
    margin-top: 22px;
    font-size: 0.75rem;
    color: var(--ink-soft);
    border-top: 1px dashed var(--line);
    padding-top: 14px;
  }

  .success{
    display: none;
    text-align: center;
    padding: 20px 0;
  }

  .success h2{
    font-family: Georgia, serif;
    font-size: 1.2rem;
    margin-bottom: 8px;
  }

  .success p{
    color: var(--ink-soft);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="card">
  <h1>AI無茶振り研究所 — 投稿受付</h1>
  <p class="intro">AIに聞いた質問と、返ってきた回答を教えてください。面白いもの・便利なもの・謎なもの、大歓迎です。良いものは本サイトのカードとして掲載させていただきます。</p>

  <form id="submit-form" action="https://formspree.io/f/xoeqodvl" method="POST">
    <div>
      <label for="q">AIに聞いた質問</label>
      <input type="text" id="q" name="question" required>
    </div>

    <div>
      <label for="a">返ってきた回答</label>
      <textarea id="a" name="answer" required></textarea>
    </div>

    <div>
      <label for="tag">カテゴリー</label>
      <select id="tag" name="category">
        <option value="面白い">面白い</option>
        <option value="便利">便利</option>
        <option value="謎">謎</option>
      </select>
    </div>

    <div>
      <label for="name">投稿者名（任意・未入力の場合は「名無し」で掲載）</label>
      <input type="text" id="name" name="nickname">
    </div>

    <button type="submit">送信する</button>
  </form>

  <div class="success" id="success-message">
    <h2>送信しました</h2>
    <p>投稿ありがとうございます。内容を確認のうえ、サイトに掲載させていただきます。</p>
  </div>

  <p class="note">※ 送信された内容はサイト運営者が内容を確認してから掲載します。個人が特定される情報は書かないようにお願いします。</p>
</div>

</body>
</html>
